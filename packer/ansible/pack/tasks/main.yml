---
# Pack role - Install and configure nginx in the AMI
- name: Update all packages
  ansible.builtin.yum:
    name: '*'
    state: latest
    update_cache: yes
  become: yes

- name: Install nginx
  ansible.builtin.yum:
    name: nginx
    state: present
  become: yes

- name: Install additional packages
  ansible.builtin.yum:
    name:
      - wget
      - vim
      - git
    state: present
  become: yes

- name: Create nginx web root directory
  ansible.builtin.file:
    path: /usr/share/nginx/html
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'
  become: yes

- name: Deploy static HTML template
  ansible.builtin.template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
    owner: nginx
    group: nginx
    mode: '0644'
  become: yes

- name: Configure nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Enable nginx service
  ansible.builtin.systemd:
    name: nginx
    enabled: yes
  become: yes

- name: Create directory for fry scripts
  ansible.builtin.file:
    path: /opt/fry
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes
